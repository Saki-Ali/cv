<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ali Saki's curriculum vitae">
  <title>Ali Saki - CV</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111827;
      color: #f9fafb;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
    }

    a {
      display: inline-block;
      padding: 0.6rem 0.9rem;
      border-radius: 0.5rem;
      background: #f9fafb;
      color: #111827;
      font-weight: 650;
      text-decoration: none;
    }

    a:hover { background: #e5e7eb; }

    main {
      height: calc(100vh - 4.4rem);
      padding: 0 1rem 1rem;
    }

    object {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0.6rem;
      background: #fff;
    }

    .fallback {
      max-width: 40rem;
      margin: 4rem auto;
      padding: 2rem;
      text-align: center;
      color: #111827;
    }

    @media (max-width: 600px) {
      header { align-items: flex-start; }
      main { padding: 0; }
      object { border-radius: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ali Saki - CV</h1>
    <a href="Ali-Saki-CV.pdf" download>Download PDF</a>
  </header>
  <main>
    <object data="Ali-Saki-CV.pdf" type="application/pdf">
      <div class="fallback">
        <p>Your browser cannot display the CV preview.</p>
        <a href="Ali-Saki-CV.pdf">Open the PDF</a>
      </div>
    </object>
  </main>
</body>
</html>
